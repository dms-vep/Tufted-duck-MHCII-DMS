# --------------------------------------------------------------------------------------
# Define how to create summary plots across multiple assays.
# --------------------------------------------------------------------------------------

# define defaults shared across summaries
summary_default: &summary_default
  min_times_seen: 2  # only include mutations with times_seen >= this
  min_frac_models: 0.75  # only include mutations in >= this fraction of models (selections)
  alphabet: [A, C, D, E, F, G, H, I, K, L, M, N, P, Q, R, S, T, V, W, Y]  # amino acids to include
  init_floor_escape_at_zero: false  # initially floor site escape to be >= 0?
  init_site_escape_stat: sum  # initially show site escape as this statistic
  sites_to_exclude: ["196(a)", "197(a)", "198(a)", "199(a)", "200(a)", "201(a)", "202(a)",
      "203(a)", "204(a)", "205(a)", "206(a)", "207(a)", "208(a)", "209(a)",
      "210(a)", "211(a)", "212(a)", "213(a)", "214(a)", "215(a)", "216(a)",
      "217(a)", "218(a)", "219(a)", "220(a)", "221(a)", "222(a)", "223(a)",
      "224(a)", "225(a)", "226(a)", "227(a)", "228(a)", "229(a)", "230(a)",
      "231(a)", "232(a)", "233(a)",
      "1(T2A)", "2(T2A)", "3(T2A)", "4(T2A)", "5(T2A)", "6(T2A)", "7(T2A)",
      "8(T2A)", "9(T2A)", "10(T2A)", "11(T2A)", "12(T2A)", "13(T2A)",
      "14(T2A)", "15(T2A)", "16(T2A)", "17(T2A)", "18(T2A)", "19(T2A)",
      "20(T2A)", "21(T2A)",
      "-24(b)", "-23(b)", "-22(b)", "-21(b)", "-20(b)", "-19(b)", "-18(b)",
      "-17(b)", "-16(b)", "-15(b)", "-14(b)", "-13(b)", "-12(b)", "-11(b)",
      "-10(b)", "-9(b)", "-8(b)", "-7(b)", "-6(b)", "-5(b)", "-4(b)",
      "-3(b)", "-2(b)", "-1(b)", "1(b)"]

cell_entry_default: &cell_entry_default
  stat: effect  # column to plot
  color_scheme: redblue
  max_at_least: 2
  fixed_min: -5
  init_min_value: null
  le_filters:
    effect_std: 1.5  # remove if std > than this

# Entry in different cells
entry_all_cells:
  <<: *summary_default
  antibody_escape: {}
  other_phenotypes:
    entry in 292_M3_tat_H5 cells:
      <<: *cell_entry_default
      csv: results/func_effects/averages/293_M3_tat_H5_RT_func_effects_singlemut.csv


HA_binding:
  <<: *summary_default
  antibody_escape:  # show effects on antibody escape, empty dict if no antibodies being shown
    HA binding:  # name each set of antibodies
      stat: HA binding_median  # statistic to use for escape
      positive_color: "#134B85"  
      negative_color: "#AA2531"  
      max_at_least: 1.5  # make heatmap max at least
      min_at_least: -2  # make heatmap min at least this
      antibody_list:  # antibodies to include: keys name used for `avg_escape`, values name for plot
        H5-HA: results/HA_binding/averages/H5_HA_binding_mut_effect.csv
      le_filters:
        HA binding_std: 2.6
  other_phenotypes:
    entry in 292_M3_tat_H5 cells:  
      <<: *cell_entry_default
      csv: results/func_effects/averages/293_M3_tat_H5_RT_func_effects_singlemut.csv
      init_min_value: -3  # initial min value in slider        
